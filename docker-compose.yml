services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gof
      POSTGRES_PASSWORD: gof
      POSTGRES_DB: gof_cards
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gof -d gof_cards"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://gof:gof@db:5432/gof_cards
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      SYNC_ON_STARTUP: "true"
      SYNC_INTERVAL_SECONDS: "300"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  appdata:
